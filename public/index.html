<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBA API Dashboard</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Teko:wght@400;600;700&amp;family=Roboto:wght@300;400;700&amp;display=swap"
        rel="stylesheet">
    <style>
        :root {
            --nba-red: #C9082A;
            --nba-blue: #17408B;
            --bg-color: #f4f5f7;
            --card-bg: #ffffff;
            --text-main: #111111;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            color: var(--text-main);
        }

        header {
            background: linear-gradient(90deg, var(--nba-blue) 0%, var(--nba-red) 100%);
            color: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }

        h1 {
            margin: 0;
            font-family: 'Teko', sans-serif;
            font-size: 3rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-weight: 700;
            background: rgba(255, 255, 255, 0.2);
            padding: 8px 16px;
            border-radius: 4px;
            transition: 0.3s;
        }

        .nav-links a:hover {
            background: white;
            color: var(--nba-blue);
        }

        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        /* Stat Cards - Top */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
            border-top: 6px solid var(--nba-blue);
        }

        .stat-card.red-card {
            border-top-color: var(--nba-red);
        }

        .stat-card.yellow-card {
            border-top-color: #eab308;
        }

        .stat-card h3 {
            margin: 0;
            color: #555;
            text-transform: uppercase;
            font-size: 1rem;
            font-weight: 700;
        }

        .stat-card .value {
            font-family: 'Teko', sans-serif;
            font-size: 4.5rem;
            margin: 10px 0 0 0;
            line-height: 1;
            color: var(--nba-blue);
        }

        .stat-card.red-card .value {
            color: var(--nba-red);
        }

        .stat-card.yellow-card .value {
            color: #eab308;
        }

        .section-header {
            font-family: 'Teko', sans-serif;
            font-size: 2.5rem;
            border-bottom: 2px solid #ddd;
            padding-bottom: 10px;
            margin-top: 50px;
        }

        /* Lists */
        .data-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .item-card {
            background: white;
            padding: 20px;
            border-radius: 6px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            border-left: 5px solid var(--nba-red);
        }

        .item-card.blue-card {
            border-left-color: var(--nba-blue);
        }

        .item-card.green-card {
            border-left-color: #eab308;
        }

        .item-card h4 {
            margin: 0 0 10px 0;
            font-size: 1.3rem;
        }

        .item-card p {
            margin: 5px 0;
            color: #444;
            font-size: 0.95rem;
        }

        .loader {
            text-align: center;
            font-size: 1.5rem;
            font-family: 'Teko', sans-serif;
            color: #888;
        }
    </style>
</head>

<body>

    <header>
        <h1>🏀 NBA API Dashboard</h1>
        <div class="nav-links">
            <a href="/api-docs" target="_blank">📄 Swagger API Docs</a>
        </div>
    </header>

    <div class="container">
        <div class="dashboard-grid">
            <div class="stat-card">
                <h3>Equipos Registrados</h3>
                <div class="value" id="teamsCount">-</div>
            </div>
            <div class="stat-card red-card">
                <h3>Jugadores</h3>
                <div class="value" id="playersCount">-</div>
            </div>
            <div class="stat-card yellow-card">
                <h3>Partidos</h3>
                <div class="value" id="gamesCount">-</div>
            </div>
        </div>

        <h2 class="section-header">Equipos Destacados</h2>
        <div id="teamsContainer" class="data-grid">
            <div class="loader">Cargando equipos...</div>
        </div>

        <h2 class="section-header">Últimos Jugadores</h2>
        <div id="playersContainer" class="data-grid">
            <div class="loader">Cargando jugadores...</div>
        </div>

        <h2 class="section-header">Partidos Recientes</h2>
        <div id="gamesContainer" class="data-grid">
            <div class="loader">Cargando partidos...</div>
        </div>
    </div>

    <script>
        async function fetchData() {
            try {
                // Fetch Teams
                const teamsRes = await fetch('/api/v1/teams?limit=8');
                const teamsData = await teamsRes.json();
                document.getElementById('teamsCount').innerText = teamsData.data?.length || 0;

                const teamsHtml = (teamsData.data || []).map(team => `
                <div class="item-card">
                    <h4>${team.name}</h4>
                    <p><strong>Ciudad:</strong> ${team.city}</p>
                    <p><strong>Conferencia:</strong> ${team.conference}</p>
                </div>
            `).join('');
                document.getElementById('teamsContainer').innerHTML = teamsHtml || '<p>No hay equipos aún.</p>';

                // Fetch Players
                const playersRes = await fetch('/api/v1/players?limit=8');
                const playersData = await playersRes.json();
                document.getElementById('playersCount').innerText = playersData.pagination?.totalItems || 0;

                const playersHtml = (playersData.data || []).map(player => `
                <div class="item-card blue-card">
                    <h4>${player.firstName} ${player.lastName}</h4>
                    ${player.position ? `<p><strong>Posición:</strong> ${player.position}</p>` : ''}
                    ${player.jerseyNumber != null ? `<p><strong>Número:</strong> #${player.jerseyNumber}</p>` : ''}
                </div>
            `).join('');
                document.getElementById('playersContainer').innerHTML = playersHtml || '<p>No hay jugadores aún.</p>';

                // Fetch Games
                const gamesRes = await fetch('/api/v1/games?limit=8');
                const gamesData = await gamesRes.json();
                document.getElementById('gamesCount').innerText = gamesData.pagination?.totalItems || 0;

                const gamesHtml = (gamesData.data || []).map(game => `
                <div class="item-card green-card">
                    <h4>${new Date(game.date).toLocaleDateString('es-ES')}</h4>
                    <p><strong>Temporada:</strong> ${game.season}</p>
                    <p><strong>Resultado:</strong> ${game.homeScore ?? '—'} - ${game.awayScore ?? '—'}</p>
                    <p><strong>Fase:</strong> ${game.phase}</p>
                </div>
            `).join('');
                document.getElementById('gamesContainer').innerHTML = gamesHtml || '<p>No hay partidos aún.</p>';

            } catch (error) {
                console.error("Error cargando la API:", error);
                document.getElementById('teamsContainer').innerHTML = '<p style="color:red;">Error conectando con la API.</p>';
                document.getElementById('playersContainer').innerHTML = '';
                document.getElementById('gamesContainer').innerHTML = '';
            }
        }

        fetchData();
    </script>

</body>

</html>
