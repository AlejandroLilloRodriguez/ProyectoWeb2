openapi: 3.1.0
info:
  title: API REST de Estadisticas de Baloncesto NBA
  version: 1.0.0
  license:
    name: ISC
    identifier: ISC
  summary: API para gestionar equipos, jugadores y partidos NBA.
  description: |
    API REST disenada para la asignatura SW II.

    Cubre CRUD sobre teams, players y games, relaciones entre recursos,
    paginacion, filtrado, respuestas JSON y respuesta XML para un equipo.
servers:
  - url: http://localhost:3000/api/v1
    description: Entorno local
security: []
tags:
  - name: Health
    description: Estado del servicio
  - name: Teams
    description: Equipos NBA
  - name: Players
    description: Jugadores NBA
  - name: Games
    description: Partidos NBA
paths:
  /health:
    get:
      tags: [Health]
      summary: Estado del servicio
      operationId: getHealth
      responses:
        '200':
          description: Servicio operativo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /teams:
    get:
      tags: [Teams]
      summary: Lista equipos
      operationId: listTeams
      parameters:
        - $ref: '#/components/parameters/ConferenceParam'
        - $ref: '#/components/parameters/DivisionParam'
        - $ref: '#/components/parameters/CityParam'
        - $ref: '#/components/parameters/NameParam'
      responses:
        '200':
          description: Lista de equipos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamListResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Teams]
      summary: Crea un equipo
      operationId: createTeam
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamCreateRequest'
            examples:
              default:
                value:
                  name: Lakers
                  city: Los Angeles
                  abbreviation: LAL
                  conference: West
                  division: Pacific
                  foundedYear: 1947
                  venue: Crypto.com Arena
      responses:
        '201':
          description: Equipo creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /teams/{teamId}:
    get:
      tags: [Teams]
      summary: Recupera un equipo
      operationId: getTeamById
      parameters:
        - $ref: '#/components/parameters/TeamIdPath'
      responses:
        '200':
          description: Equipo encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
            application/xml:
              schema:
                $ref: '#/components/schemas/Team'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [Teams]
      summary: Reemplaza un equipo
      operationId: replaceTeam
      parameters:
        - $ref: '#/components/parameters/TeamIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamCreateRequest'
      responses:
        '200':
          description: Equipo actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags: [Teams]
      summary: Actualiza parcialmente un equipo
      operationId: patchTeam
      parameters:
        - $ref: '#/components/parameters/TeamIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamPatchRequest'
      responses:
        '200':
          description: Equipo actualizado parcialmente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Teams]
      summary: Elimina un equipo
      operationId: deleteTeam
      parameters:
        - $ref: '#/components/parameters/TeamIdPath'
      responses:
        '204':
          description: Equipo eliminado
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /teams/{teamId}/players:
    get:
      tags: [Teams, Players]
      summary: Lista jugadores de un equipo
      operationId: listPlayersByTeam
      parameters:
        - $ref: '#/components/parameters/TeamIdPath'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Jugadores del equipo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerListResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /teams/{teamId}/games:
    get:
      tags: [Teams, Games]
      summary: Lista partidos de un equipo
      operationId: listGamesByTeam
      parameters:
        - $ref: '#/components/parameters/TeamIdPath'
        - $ref: '#/components/parameters/SeasonParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Partidos del equipo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameListResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /players:
    get:
      tags: [Players]
      summary: Lista jugadores
      operationId: listPlayers
      parameters:
        - $ref: '#/components/parameters/TeamIdQuery'
        - $ref: '#/components/parameters/PositionParam'
        - $ref: '#/components/parameters/ActiveParam'
        - $ref: '#/components/parameters/SearchParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Lista de jugadores
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerListResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Players]
      summary: Crea un jugador
      operationId: createPlayer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlayerCreateRequest'
            examples:
              default:
                value:
                  firstName: LeBron
                  lastName: James
                  fullName: LeBron James
                  position: F
                  active: true
                  teamId: 6610b1e02c6a2f0012df1001
      responses:
        '201':
          description: Jugador creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Player'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /players/{playerId}:
    get:
      tags: [Players]
      summary: Recupera un jugador
      operationId: getPlayerById
      parameters:
        - $ref: '#/components/parameters/PlayerIdPath'
      responses:
        '200':
          description: Jugador encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Player'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [Players]
      summary: Reemplaza un jugador
      operationId: replacePlayer
      parameters:
        - $ref: '#/components/parameters/PlayerIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlayerCreateRequest'
      responses:
        '200':
          description: Jugador actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Player'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags: [Players]
      summary: Actualiza parcialmente un jugador
      operationId: patchPlayer
      parameters:
        - $ref: '#/components/parameters/PlayerIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlayerPatchRequest'
      responses:
        '200':
          description: Jugador actualizado parcialmente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Player'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Players]
      summary: Elimina un jugador
      operationId: deletePlayer
      parameters:
        - $ref: '#/components/parameters/PlayerIdPath'
      responses:
        '204':
          description: Jugador eliminado
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /players/{playerId}/team:
    get:
      tags: [Players, Teams]
      summary: Recupera el equipo del jugador
      operationId: getTeamByPlayer
      parameters:
        - $ref: '#/components/parameters/PlayerIdPath'
      responses:
        '200':
          description: Equipo del jugador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /games:
    get:
      tags: [Games]
      summary: Lista partidos con filtros y paginacion
      operationId: listGames
      parameters:
        - $ref: '#/components/parameters/SeasonParam'
        - $ref: '#/components/parameters/TeamIdQuery'
        - $ref: '#/components/parameters/StatusParam'
        - $ref: '#/components/parameters/PhaseParam'
        - $ref: '#/components/parameters/DateFromParam'
        - $ref: '#/components/parameters/DateToParam'
        - $ref: '#/components/parameters/WinnerTeamIdParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Lista paginada de partidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameListResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Games]
      summary: Crea un partido
      operationId: createGame
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameCreateRequest'
            examples:
              default:
                value:
                  season: 2024
                  date: '2024-11-15T00:00:00.000Z'
                  status: finished
                  phase: regular
                  homeTeamId: 6610b1e02c6a2f0012df1001
                  awayTeamId: 6610b1e02c6a2f0012df1002
                  homeScore: 118
                  awayScore: 110
                  winnerTeamId: 6610b1e02c6a2f0012df1001
                  arena: Crypto.com Arena
                  city: Los Angeles
      responses:
        '201':
          description: Partido creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Game'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /games/{gameId}:
    get:
      tags: [Games]
      summary: Recupera un partido
      operationId: getGameById
      parameters:
        - $ref: '#/components/parameters/GameIdPath'
      responses:
        '200':
          description: Partido encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Game'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [Games]
      summary: Reemplaza un partido
      operationId: replaceGame
      parameters:
        - $ref: '#/components/parameters/GameIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameCreateRequest'
      responses:
        '200':
          description: Partido actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Game'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags: [Games]
      summary: Actualiza parcialmente un partido
      operationId: patchGame
      parameters:
        - $ref: '#/components/parameters/GameIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GamePatchRequest'
      responses:
        '200':
          description: Partido actualizado parcialmente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Game'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Games]
      summary: Elimina un partido
      operationId: deleteGame
      parameters:
        - $ref: '#/components/parameters/GameIdPath'
      responses:
        '204':
          description: Partido eliminado
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  parameters:
    TeamIdPath:
      name: teamId
      in: path
      required: true
      schema:
        type: string
    PlayerIdPath:
      name: playerId
      in: path
      required: true
      schema:
        type: string
    GameIdPath:
      name: gameId
      in: path
      required: true
      schema:
        type: string
    ConferenceParam:
      name: conference
      in: query
      schema:
        type: string
        enum: [East, West]
    DivisionParam:
      name: division
      in: query
      schema:
        type: string
    CityParam:
      name: city
      in: query
      schema:
        type: string
    NameParam:
      name: name
      in: query
      schema:
        type: string
    TeamIdQuery:
      name: teamId
      in: query
      schema:
        type: string
    PositionParam:
      name: position
      in: query
      schema:
        type: string
    ActiveParam:
      name: active
      in: query
      schema:
        type: boolean
    SearchParam:
      name: search
      in: query
      schema:
        type: string
    SeasonParam:
      name: season
      in: query
      schema:
        type: integer
        minimum: 1946
    StatusParam:
      name: status
      in: query
      schema:
        type: string
        enum: [scheduled, live, finished]
    PhaseParam:
      name: phase
      in: query
      schema:
        type: string
        enum: [preseason, regular, playoff]
    DateFromParam:
      name: dateFrom
      in: query
      schema:
        type: string
        format: date-time
    DateToParam:
      name: dateTo
      in: query
      schema:
        type: string
        format: date-time
    WinnerTeamIdParam:
      name: winnerTeamId
      in: query
      schema:
        type: string
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    BadRequestError:
      description: Peticion invalida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            default:
              value:
                error:
                  code: BAD_REQUEST
                  message: Identificador o parametro con formato no valido
    NotFoundError:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            default:
              value:
                error:
                  code: NOT_FOUND
                  message: Recurso no encontrado
    ConflictError:
      description: Conflicto de integridad
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            default:
              value:
                error:
                  code: CONFLICT
                  message: Ya existe un recurso con esos datos unicos
    ValidationError:
      description: Error de validacion
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            default:
              value:
                error:
                  code: VALIDATION_ERROR
                  message: El cuerpo de la peticion no es valido
    InternalServerError:
      description: Error interno del servidor
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            default:
              value:
                error:
                  code: INTERNAL_ERROR
                  message: Error interno del servidor

  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
        service:
          type: string
        timestamp:
          type: string
          format: date-time
      required: [status, service, timestamp]

    Pagination:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        totalItems:
          type: integer
        totalPages:
          type: integer
        hasNextPage:
          type: boolean
        hasPreviousPage:
          type: boolean
      required: [page, limit, totalItems, totalPages, hasNextPage, hasPreviousPage]

    Team:
      type: object
      xml:
        name: Team
      properties:
        id:
          type: string
        name:
          type: string
        city:
          type: string
        abbreviation:
          type: string
        conference:
          type: string
          enum: [East, West]
        division:
          type: string
        foundedYear:
          type: [integer, 'null']
        venue:
          type: [string, 'null']
      required: [id, name, city, abbreviation, conference, division]

    TeamCreateRequest:
      type: object
      properties:
        name:
          type: string
        city:
          type: string
        abbreviation:
          type: string
        conference:
          type: string
          enum: [East, West]
        division:
          type: string
        foundedYear:
          type: integer
        venue:
          type: string
      required: [name, city, abbreviation, conference, division]

    TeamPatchRequest:
      type: object
      properties:
        name:
          type: string
        city:
          type: string
        abbreviation:
          type: string
        conference:
          type: string
          enum: [East, West]
        division:
          type: string
        foundedYear:
          type: integer
        venue:
          type: string

    Player:
      type: object
      properties:
        id:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        fullName:
          type: string
        position:
          type: [string, 'null']
        teamId:
          type: string
        heightCm:
          type: [integer, 'null']
        weightKg:
          type: [integer, 'null']
        jerseyNumber:
          type: [integer, 'null']
        active:
          type: boolean
        debutYear:
          type: [integer, 'null']
      required: [id, firstName, lastName, fullName, active, teamId]

    PlayerCreateRequest:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        fullName:
          type: string
        position:
          type: string
        teamId:
          type: string
        heightCm:
          type: integer
        weightKg:
          type: integer
        jerseyNumber:
          type: integer
        active:
          type: boolean
        debutYear:
          type: integer
      required: [firstName, lastName, fullName, active, teamId]

    PlayerPatchRequest:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        fullName:
          type: string
        position:
          type: string
        teamId:
          type: string
        heightCm:
          type: integer
        weightKg:
          type: integer
        jerseyNumber:
          type: integer
        active:
          type: boolean
        debutYear:
          type: integer

    Game:
      type: object
      properties:
        id:
          type: string
        season:
          type: integer
        date:
          type: string
          format: date-time
        status:
          type: string
          enum: [scheduled, live, finished]
        phase:
          type: string
          enum: [preseason, regular, playoff]
        homeTeamId:
          type: string
        awayTeamId:
          type: string
        homeScore:
          type: [integer, 'null']
        awayScore:
          type: [integer, 'null']
        winnerTeamId:
          type: [string, 'null']
        arena:
          type: [string, 'null']
        city:
          type: [string, 'null']
      required: [id, season, date, status, phase, homeTeamId, awayTeamId]

    GameCreateRequest:
      type: object
      properties:
        season:
          type: integer
        date:
          type: string
          format: date-time
        status:
          type: string
          enum: [scheduled, live, finished]
        phase:
          type: string
          enum: [preseason, regular, playoff]
        homeTeamId:
          type: string
        awayTeamId:
          type: string
        homeScore:
          type: integer
        awayScore:
          type: integer
        winnerTeamId:
          type: string
        arena:
          type: string
        city:
          type: string
      required: [season, date, status, phase, homeTeamId, awayTeamId]

    GamePatchRequest:
      type: object
      properties:
        season:
          type: integer
        date:
          type: string
          format: date-time
        status:
          type: string
          enum: [scheduled, live, finished]
        phase:
          type: string
          enum: [preseason, regular, playoff]
        homeTeamId:
          type: string
        awayTeamId:
          type: string
        homeScore:
          type: integer
        awayScore:
          type: integer
        winnerTeamId:
          type: string
        arena:
          type: string
        city:
          type: string

    TeamListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Team'
      required: [data]

    PlayerListResponse:
      type: object
      properties:
        data:
          type: array
